name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub runner image already ships the Android SDK (platforms, build-tools, licenses).
      # We deliberately do NOT use android-actions/setup-android: it calls
      # `sdkmanager tools`, which no longer exists and fails the build.
      # This step only pre-accepts licences so Gradle can auto-download anything missing.
      - name: Accept Android SDK licences
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          mkdir -p "$SDK/licenses" || true
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$SDK/licenses/android-sdk-license" || true
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license" || true
          ls "$SDK/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and release APKs
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --console=plain --no-daemon 2>&1 | tee build.log

      # If the build fails, show ONLY the real compiler/Gradle errors in the run summary
      # (instead of 200 lines of Gradle internals) and keep the full log as an artifact.
      - name: Show build errors
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed|Could not' -A2 build.log | head -80 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/InterviewCopilot-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/InterviewCopilot-release.apk
          ls -lh dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: InterviewCopilot-debug-apk
          path: dist/InterviewCopilot-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: InterviewCopilot-release-apk
          path: dist/InterviewCopilot-release.apk
          if-no-files-found: error

      # Publishes the APKs on the repo's "Releases" page so they can be downloaded
      # directly (no zip, no extra clicks). Never fails the build.
      - name: Publish APKs to GitHub Releases
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Interview Copilot build ${{ github.run_number }}
          body: Download **InterviewCopilot-release.apk** (or the debug one) and install it on your Android phone.
          files: |
            dist/InterviewCopilot-debug.apk
            dist/InterviewCopilot-release.apk
